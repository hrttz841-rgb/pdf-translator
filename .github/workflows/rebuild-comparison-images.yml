name: Rebuild comparison images

on:
  push:
    paths:
      - "image-staging/READY"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode staged image chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/comparison
          for name in before-ai-raw-1 before-ai-raw-2 after-cover after-toc after-preface; do
            cat image-staging/$name/*.part | base64 --decode > assets/comparison/$name.png
          done

      - name: Update README image paths
        shell: python
        run: |
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          for name in ["before-ai-raw-1","before-ai-raw-2","after-cover","after-toc","after-preface"]:
              s = s.replace(f"assets/comparison/{name}.png", f"assets/comparison/{name}.png")
              s = s.replace(f"assets/comparison/{name}.jpg", f"assets/comparison/{name}.png")
          p.write_text(s, encoding="utf-8")

      - name: Remove broken/staging assets
        shell: bash
        run: |
          rm -rf image-staging
          rm -f assets/comparison/*.jpg assets/comparison/*.webp

      - name: Commit rebuilt images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/comparison image-staging || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix comparison images with valid web assets"
          git push
